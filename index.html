<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantPal Cloud Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #101010;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 20px 10px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      margin-top: 5px;
    }

    .status {
      background: #1d2b1d;
      border: 1px solid #385638;
      border-radius: 18px;
      padding: 18px;
      margin-top: 15px;
      text-align: center;
    }

    .status-title {
      font-size: 22px;
      font-weight: bold;
    }

    .status-text {
      color: #bbb;
      margin-top: 8px;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .card {
      background: #202020;
      border-radius: 18px;
      padding: 18px;
      border: 1px solid #333;
    }

    .card-title {
      color: #999;
      font-size: 14px;
    }

    .value {
      font-size: 26px;
      font-weight: bold;
      margin-top: 8px;
    }

    .unit {
      font-size: 14px;
      color: #aaa;
    }

    .footer {
      text-align: center;
      color: #666;
      padding: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🌱 PlantPal</div>
    <div class="subtitle">Smart Plant Monitor &bull; Cloud Dashboard</div>
  </div>

  <div class="status">
    <div class="status-title" id="status">Connecting to Cloud...</div>
    <div class="status-text">
      Last synced: <span id="timestamp">--</span>
    </div>
  </div>

  <div class="grid">

    <!-- Soil Moisture -->
    <div class="card">
      <div class="card-title">🌱 SOIL</div>
      <div class="value">
        <span id="soil">--</span>
        <span class="unit">%</span>
      </div>
      <div class="card-title" style="margin-top: 6px;">
        Raw: <span id="soilRaw">--</span>
      </div>
    </div>

    <!-- Light (BH1750) -->
    <div class="card">
      <div class="card-title">☀️ LIGHT</div>
      <div class="value">
        <span id="light">--</span>
        <span class="unit">lux</span>
      </div>
    </div>

    <!-- Temperature -->
    <div class="card">
      <div class="card-title">🌡️ TEMPERATURE</div>
      <div class="value">
        <span id="temp">--</span>
        <span class="unit">°C</span>
      </div>
    </div>

    <!-- Humidity -->
    <div class="card">
      <div class="card-title">💧 HUMIDITY</div>
      <div class="value">
        <span id="humidity">--</span>
        <span class="unit">%</span>
      </div>
    </div>

    <!-- Touch Sensor -->
    <div class="card">
      <div class="card-title">👆 TOUCH</div>
      <div class="value" id="touch">--</div>
    </div>

    <!-- DFPlayer Audio Hardware -->
    <div class="card">
      <div class="card-title">🔊 AUDIO</div>
      <div class="value" id="audio">--</div>
    </div>

  </div>

  <div class="footer">
    PlantPal IoT System &bull; Live Online Monitoring
  </div>

</div>

<script>
  async function updateData() {
    try {
      const response = await fetch('/api/latest');
      const data = await response.json();

      if (data.status === "empty") {
        document.getElementById('status').innerText = "Waiting for initial sensor upload...";
        return;
      }

      document.getElementById('soil').innerText = data.soilPercent;
      document.getElementById('soilRaw').innerText = data.soilRaw;
      document.getElementById('light').innerText = data.lux;
      document.getElementById('temp').innerText = data.temperature;
      document.getElementById('humidity').innerText = data.humidity;
      document.getElementById('touch').innerText = data.touch ? 'YES' : 'NO';
      document.getElementById('audio').innerText = data.audio ? 'OK' : 'ERROR';
      document.getElementById('status').innerText = data.status;
      document.getElementById('timestamp').innerText = data.timestamp;

    } catch (error) {
      console.error("Dashboard poll error:", error);
      document.getElementById('status').innerText = "Connecting...";
    }
  }

  // Initial read and repeating poll every 2.5 seconds
  updateData();
  setInterval(updateData, 2500);
</script>

</body>
</html>
